[package]
name = "bilibili-tui"
version = "1.1.0"
edition = "2024"
authors = ["MareDevi <me@maredevi.moe>"]
description = "A terminal user interface (TUI) client for Bilibili"
license = "MIT"
repository = "https://github.com/MareDevi/bilibili-tui"
homepage = "https://github.com/MareDevi/bilibili-tui"

[dependencies]
anyhow = "1.0.105"
brotli = "9.1.3"
chrono = "0.4.45"
color-eyre = "0.6.5"
crossterm = "0.29.0"
dirs = "7.0.0"
flate2 = "1.1.11"
futures-util = "0.3.34"
image = "0.25.10"
md5 = "0.8.1"
opaline = "0.4.2"
# QrCodeWidget takes the QrCode type from qrcode 0.14.
qrcode = { version = "0.14.1", default-features = false, features = ["image"] }
quick-xml = "0.42.0"
ratatui = { version = "0.30.2", features = ["serde"] }
ratatui-image = { version = "11.1.0", default-features = false, features = ["image-defaults", "crossterm"] }
reqwest = { version = "0.13.5", features = ["json", "cookies", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
scraper = "0.29.0"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
tui-qrcode = { version = "0.2.7", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
